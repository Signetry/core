name: Umbra auto-fix (branch-only PR with receipt)

# Governed auto-remediation: scan for vulnerabilities, have a live executor draft a
# bounded fix per finding under the Umbra admission pipeline, and open a BRANCH-ONLY
# pull request for each fix that earns branch-PR (L2) authority — with the signed
# receipt attached. Umbra NEVER merges; a human reviews and merges the PR.
#
# Trigger manually (or on a schedule). Requires:
#   - OPENAI_API_KEY or a logged-in Codex, or ANTHROPIC_API_KEY for Claude Code, as
#     the executor that drafts fixes (set --fix-agent accordingly).
#   - The default GITHUB_TOKEN with contents:write + pull-requests:write to open PRs.
#
# One-time setup (wiring the executor secret + PR permissions): docs/AUTOFIX_SETUP.md
on:
  workflow_dispatch:
    inputs:
      fix_agent:
        description: "Executor that drafts fixes (codex-cli | claude-code)"
        default: "codex-cli"
      fail_on:
        description: "Severity that gates the scan report (advisory here)"
        default: "high"
      openai_base_url:
        description: "Optional OpenAI-compatible base URL for a gateway (e.g. IBM ICA: https://api.nextgen-beta.ica.ibm.com/ica/v1). Blank = api.openai.com."
        default: ""
      codex_model:
        description: "Codex model to request when using a custom base URL (e.g. gpt-5.5-gus for IBM ICA)."
        default: ""
      anthropic_base_url:
        description: "Optional Anthropic-compatible base URL for a gateway (e.g. IBM ICA: https://api.nextgen-beta.ica.ibm.com/ica). Blank = api.anthropic.com."
        default: ""
      claude_model:
        description: "Claude model to request when using claude-code (e.g. claude-opus-4-8 for IBM ICA)."
        default: ""
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: write        # create the fix branch
  pull-requests: write   # open the branch-only PR

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable a working sandbox for the executor
        run: |
          # Codex/Claude sandbox the agent while it drafts (workspace-write). On
          # Ubuntu runners, unprivileged user namespaces are clamped by AppArmor,
          # which makes the sandbox fail to initialize (codex exec rc=1). Install
          # bubblewrap and relax the clamp so the sandbox can start. All non-fatal.
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap || \
              echo "::warning::could not install bubblewrap."
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 >/dev/null 2>&1 || true
          command -v bwrap >/dev/null 2>&1 && echo "bubblewrap ready." || echo "::notice::bwrap unavailable; executor may cap at analyze."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Umbra
        # umbra-core is source-available (All Rights Reserved) and not on PyPI —
        # install it from the source repo by tag.
        run: pip install "umbra-core @ git+https://github.com/Signetry/core@v0.5.4"

      - name: Install the executor CLI
        env:
          FIX_AGENT: ${{ github.event.inputs.fix_agent || 'codex-cli' }}
          # The key is needed here only to non-interactively authenticate the codex
          # CLI (piped via stdin, never echoed). Scoped to this step; not written to git.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL_IN: ${{ github.event.inputs.openai_base_url }}
          CODEX_MODEL_IN: ${{ github.event.inputs.codex_model }}
        run: |
          # The executor that DRAFTS fixes is a separate CLI (claude / codex), not
          # part of umbra-core. Install the one selected so its `available()` probe
          # passes and it can actually propose a change (else fusion caps at analyze).
          set -euo pipefail
          [ -n "${OPENAI_API_KEY:-}" ] && echo "::add-mask::$OPENAI_API_KEY"
          case "$FIX_AGENT" in
            claude-code)
              npm install -g @anthropic-ai/claude-code || echo "::warning::claude CLI install failed; fusion will cap at analyze."
              claude --version || echo "::warning::claude CLI not runnable."
              # Claude Code authenticates strictly via ANTHROPIC_API_KEY at run time
              # (set in the scan step); no separate login command is needed.
              ;;
            codex-cli)
              npm install -g @openai/codex || echo "::warning::codex CLI install failed; fusion will cap at analyze."
              codex --version || echo "::warning::codex CLI not runnable."
              if [ -n "${OPENAI_BASE_URL_IN:-}" ]; then
                # Custom OpenAI-compatible gateway (e.g. IBM ICA). Codex uses a named
                # provider from an isolated CODEX_HOME with API-key auth. The model
                # must be one your gateway entitles (e.g. gpt-5.5-gus for IBM ICA).
                CH="${RUNNER_TEMP:-/tmp}/codex-home"; mkdir -p "$CH"
                echo "CODEX_HOME=$CH" >> "$GITHUB_ENV"
                MODEL="${CODEX_MODEL_IN:-gpt-5.5-gus}"
                {
                  echo "model = \"$MODEL\""
                  echo "model_provider = \"gateway\""
                  echo "preferred_auth_method = \"apikey\""
                  echo ""
                  echo "[model_providers.gateway]"
                  echo "name = \"Custom OpenAI-compatible gateway\""
                  echo "base_url = \"$OPENAI_BASE_URL_IN\""
                  echo "env_key = \"OPENAI_API_KEY\""
                  echo "wire_api = \"responses\""
                } > "$CH/config.toml"
                echo "Configured Codex for gateway $OPENAI_BASE_URL_IN (model $MODEL)."
                # No `codex login` needed — the provider's env_key supplies auth.
              elif [ -n "${OPENAI_API_KEY:-}" ]; then
                # Standard api.openai.com: non-interactive login from the API key.
                printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key \
                  && codex login status \
                  || echo "::warning::codex login failed; fusion will cap at analyze."
              else
                echo "::warning::OPENAI_API_KEY not set; codex cannot authenticate."
              fi
              ;;
            *) echo "::error::Unknown fix_agent '$FIX_AGENT'"; exit 1 ;;
          esac

      - name: Scan + propose governed fixes (JSON)
        env:
          # Bring-your-own-key: the executor's credential is read from THIS repo's
          # own secret and used only to let the agent draft the patch. It is scoped
          # to this step alone (the PR-opening step below does not see it), never
          # written to git, and Umbra redacts credential shapes from the diff/receipt
          # before anything is serialised. Umbra never pushes/merges with it.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional gateway base URLs (e.g. IBM ICA). Blank = the native provider.
          OPENAI_BASE_URL: ${{ github.event.inputs.openai_base_url }}
          ANTHROPIC_BASE_URL: ${{ github.event.inputs.anthropic_base_url }}
          # Request an entitled model on the gateway (e.g. IBM ICA: gpt-5.5-gus / claude-opus-4-8).
          UMBRA_CODEX_MODEL: ${{ github.event.inputs.codex_model }}
          UMBRA_CLAUDE_MODEL: ${{ github.event.inputs.claude_model }}
          # The executors are fail-closed: they only run when explicitly enabled.
          UMBRA_ENABLE_CLAUDE_CODE: ${{ (github.event.inputs.fix_agent || 'codex-cli') == 'claude-code' && 'true' || 'false' }}
          UMBRA_ENABLE_CODEX_CLI: ${{ (github.event.inputs.fix_agent || 'codex-cli') == 'codex-cli' && 'true' || 'false' }}
          # On CI runners the OS sandbox (bubblewrap/Landlock) often can't initialize,
          # so `codex exec --sandbox workspace-write` fails. Drafting happens in a
          # disposable checkout with NO push/merge credentials, and Umbra's admission
          # pipeline governs the result regardless — so full-access drafting here is
          # safe and is the mode that works on the runner.
          UMBRA_CODEX_SANDBOX: "danger-full-access"
        run: |
          OUT="${RUNNER_TEMP:-/tmp}/umbra"; mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          # Belt-and-suspenders: register the values with the runner's log masker so
          # they can never surface in logs even if a tool echoed them.
          [ -n "$OPENAI_API_KEY" ] && echo "::add-mask::$OPENAI_API_KEY"
          [ -n "$ANTHROPIC_API_KEY" ] && echo "::add-mask::$ANTHROPIC_API_KEY"
          # Scan the repo and, for each finding, draft a bounded fix via the live
          # agent under the admission pipeline. --json emits {findings} then {fixes}.
          umbra --json scan . \
            --fix --fix-agent "${{ github.event.inputs.fix_agent || 'codex-cli' }}" \
            --max-fixes 5 > "$OUT/scan-and-fixes.json" || true
          echo "wrote $OUT/scan-and-fixes.json"

      - name: Fail closed if any credential shape leaked into the output
        run: |
          OUT="${OUT:-${RUNNER_TEMP:-/tmp}/umbra}"
          # Defense-in-depth: the engine redacts secrets from diffs/receipts, but if a
          # recognisable credential shape ever appears in the artifact, abort before it
          # can reach a PR. (Matches provider key prefixes + PEM private-key blocks.)
          if grep -Eq 'sk-(ant-)?[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' "$OUT/scan-and-fixes.json" 2>/dev/null; then
            echo "::error::A credential-shaped token was found in the fix output; aborting so it cannot reach a PR."
            exit 1
          fi
          echo "no credential shapes in output — safe to open PRs"

      - name: Open a branch-only PR for each branch-PR-ready fix (never merges)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="${OUT:-${RUNNER_TEMP:-/tmp}/umbra}"
          python - "$OUT/scan-and-fixes.json" <<'PY'
          import json, os, subprocess, sys, hashlib, pathlib

          path = sys.argv[1]
          # Output is the findings report JSON followed by a {"fixes": [...]} object.
          # Decode consecutive JSON values robustly with raw_decode.
          text = pathlib.Path(path).read_text().strip() if os.path.exists(path) else ""
          objs, idx, dec = [], 0, json.JSONDecoder()
          while idx < len(text):
              while idx < len(text) and text[idx] in " \t\r\n":
                  idx += 1
              if idx >= len(text):
                  break
              try:
                  obj, end = dec.raw_decode(text, idx)
              except json.JSONDecodeError:
                  break
              objs.append(obj)
              idx = end
          fixes = []
          for obj in objs:
              if isinstance(obj, dict) and "fixes" in obj:
                  fixes = obj["fixes"]
          ready = [f for f in fixes if f.get("branch_pr_ready") and f.get("diff")]
          if not ready:
              print("No branch-PR-ready fixes; nothing to open (report-only).")
              sys.exit(0)

          for f in ready:
              finding = f["finding"]
              rid = finding.get("rule_id", "fix")
              slug = hashlib.sha1((rid + finding.get("file","")).encode()).hexdigest()[:8]
              branch = f"umbra/fix-{finding.get('category','issue')}-{slug}"
              subprocess.run(["git", "checkout", "-B", branch], check=True)
              # Apply the governed diff (recomputed by Umbra from the final tree).
              diff = f["diff"]
              p = pathlib.Path("umbra.patch"); p.write_text(diff)
              subprocess.run(["git", "apply", "umbra.patch"], check=False)
              p.unlink(missing_ok=True)
              # Write the signed receipt into the PR for auditors.
              receipt = f.get("receipt") or {}
              rp = pathlib.Path(".umbra-receipt.json"); rp.write_text(json.dumps(receipt, indent=2))
              subprocess.run(["git", "add", "-A"], check=True)
              subprocess.run(["git", "-c", "user.name=umbra[bot]",
                              "-c", "user.email=umbra@users.noreply.github.com",
                              "commit", "-m",
                              f"fix({finding.get('category')}): {finding.get('title','')}\n\n"
                              f"Umbra admission L{f.get('authority_level')} — {f.get('outcome','')}\n"
                              f"auto_merge: never (human merges)"], check=False)
              subprocess.run(["git", "push", "-f", "origin", branch], check=False)
              body = (
                  f"### Umbra governed fix — {finding.get('category')} ({finding.get('cwe','')})\n\n"
                  f"- File: `{finding.get('file')}:{finding.get('line')}`\n"
                  f"- Authority earned: **L{f.get('authority_level')} ({f.get('authority')})**\n"
                  f"- Receipt: `{receipt.get('canonical_hash','(unsigned)')}`\n"
                  f"- `auto_merge`: **never** — a human reviews and merges.\n\n"
                  f"> {f.get('outcome','')}\n\n"
                  f"The signed receipt is committed as `.umbra-receipt.json` and can be "
                  f"verified offline with `umbra verify .umbra-receipt.json`."
              )
              subprocess.run(["gh", "pr", "create", "--head", branch,
                              "--title", f"Umbra fix: {finding.get('title','security fix')}",
                              "--body", body], check=False)
              subprocess.run(["git", "checkout", "-"], check=False)
              print(f"opened branch-only PR for {branch}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umbra-autofix
          path: ${{ env.OUT }}/scan-and-fixes.json
          if-no-files-found: ignore
