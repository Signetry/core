name: Reviewer

# Advisory PR review (signetry-reviewer): surfaces architecture + security issues,
# cross-verifies them against the deterministic self-admission check, and posts a
# recommendation. Advisory only — it never merges and does not block the PR
# (the self-admission + test checks remain the gates). It escalates changes to
# security-sensitive surfaces (workflows, release, packaging) to a human.
#
# This job runs against untrusted PR code, so it deliberately holds NO write
# permission. On a fork PR, GitHub downgrades GITHUB_TOKEN to read-only
# regardless of the `permissions:` block, which is why requesting
# `pull-requests: write` here failed with "Resource not accessible by
# integration" (403) on every outside contribution. The rendered comment is
# handed to the trusted `Reviewer comment` workflow (reviewer-comment.yml) via
# an artifact and posted from there.
#
# We deliberately do NOT use `pull_request_target`: that runs with a writable
# token in the base repo's context, and checking out PR head code under it is a
# remote-code-execution footgun.
on:
  pull_request:

permissions:
  contents: read
  checks: read           # cross-verify the self-admission check status

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signetry-reviewer
        # source-available (All Rights Reserved); install from source, not PyPI.
        run: pip install "signetry-reviewer @ git+https://github.com/Signetry/reviewer@v0.1.2"

      - name: Compute the PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          echo "OUT=${RUNNER_TEMP:-/tmp}/rev" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP:-/tmp}/rev"
          git diff "$BASE_SHA" "$HEAD_SHA" > "${RUNNER_TEMP:-/tmp}/rev/pr.diff"

      - name: Look up the self-admission check status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --jq '(.check_runs // []) | map(select(.name == "self-admission")) | .[0] // {} |
                  (if .status == "completed" then (.conclusion // "unknown") else "pending" end)' 2>/dev/null || echo "unknown")
          case "$STATUS" in
            success) M=success ;;
            failure|cancelled|timed_out|action_required) M=failure ;;
            pending|queued|in_progress) M=pending ;;
            ""|null) M=missing ;;
            *) M=unknown ;;
          esac
          echo "status=$M" >> "$GITHUB_OUTPUT"

      - name: Run the advisory review
        id: review
        env:
          REQ: ${{ steps.check.outputs.status }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # GitHub runs `run:` steps as `bash -e`, so a non-zero exit from the
          # reviewer aborted the step before the trailing `exit 0` could run —
          # which made this "advisory" job fail the PR on any Block verdict,
          # exactly what the header says it must never do. `set +e` plus an
          # explicit `|| true` keeps the verdict in the comment, not the check.
          set +e
          set -uo pipefail
          signetry-reviewer review \
            --diff "$OUT/pr.diff" \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR" \
            --required-check "$REQ" \
            --protected ".github/workflows/*,.github/actions/**,pyproject.toml,signetry_core/pipeline/receipt.py,signetry_core/pipeline/gates.py,signetry_core/pipeline/verifier.py,signetry_core/pipeline/contract.py,signetry_core/pipeline/trust_boundary.py" \
            --comment-out "$OUT/comment.md" \
            --json-out "$OUT/review.json" || true
          exit 0   # advisory: never fail the PR from this job

      # Hand the rendered comment to the trusted workflow. This job cannot post
      # it itself: it has no write permission, and on fork PRs it could not be
      # granted one. The PR number travels in the artifact because
      # `workflow_run.pull_requests` is empty for forks.
      - name: Stage the review comment for the trusted poster
        if: always()
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP:-/tmp}/rev-out"
          if [ -f "$OUT/comment.md" ]; then
            cp "$OUT/comment.md" "${RUNNER_TEMP:-/tmp}/rev-out/comment.md"
          else
            printf 'Signetry Reviewer: no review was produced.\n' \
              > "${RUNNER_TEMP:-/tmp}/rev-out/comment.md"
          fi
          # Digits only — this value is read back by the trusted workflow.
          printf '%s' "$PR" | tr -cd '0-9' > "${RUNNER_TEMP:-/tmp}/rev-out/pr-number"

      - name: Upload the review comment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signetry-reviewer-comment
          path: ${{ runner.temp }}/rev-out
          retention-days: 3
          if-no-files-found: warn
