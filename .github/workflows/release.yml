name: Release

# Cuts a GitHub Release when a version tag is pushed (e.g. v0.5.3).
#
# umbra-core is SOURCE-AVAILABLE (All Rights Reserved) and is NOT published to
# PyPI — it is installed from source by tag:
#   pip install "umbra-core @ git+https://github.com/bkd-dotcom/umbra-core@v0.5.3"
# The former PyPI Trusted-Publishing job was removed on the source-available
# lockdown (all PyPI releases were yanked). This workflow only builds/tests and
# attaches the built artifacts to a GitHub Release for convenience.
#
# Then: git tag v0.5.3 && git push origin v0.5.3

on:
  push:
    tags:
      # Only full semver tags (e.g. v0.5.4) cut a release. A moving major tag
      # (if ever added) must not trigger this — its name won't match the
      # pyproject version and would fail the tag/version check.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"; exit 1
          fi

      - name: Test before releasing
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run pytest -q

      - name: Build sdist + wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Pull the section for this version from CHANGELOG.md (between its
          # "## [x.y.z]" heading and the next "## " heading).
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              $0 ~ "^## \\[" ver "\\]" {grab=1; next}
              grab && /^## / {exit}
              grab {print}
            ' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}. See CHANGELOG.md." > notes.md
          fi
          echo "" >> notes.md
          echo "Source-available (All Rights Reserved); install from source:" >> notes.md
          echo '```' >> notes.md
          echo "pip install \"umbra-core @ git+https://github.com/bkd-dotcom/umbra-core@${GITHUB_REF_NAME}\"" >> notes.md
          echo '```' >> notes.md
          echo "Notes for ${GITHUB_REF_NAME}:"; cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "umbra-core ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag \
            dist/* \
            || gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
